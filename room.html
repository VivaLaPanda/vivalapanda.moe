<!DOCTYPE html>

					</div>
				</div>
			</div>
			<div class="subwindow" id="left-sidebar">

        <a class="navbutton" href="/living-room.html" title="Home">

        </a>

        </a>

        </a>
    </div>
    <div class="nav-row">
        <a class="navbutton" href="/recipes.html">
            <img src="/img/icons/recipes_recolor.png"></img>
        </a>
        <span class="navbutton" aria-hidden="true"></span>
    </div>
</div>
