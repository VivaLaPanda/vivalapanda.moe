<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda's Recipe Book</title>
    <link href="/css/style.css?version=5" rel="stylesheet" type="text/css" media="all">
    <link href="/css/textpage.css?version=4" rel="stylesheet" type="text/css" media="all">
    <link href="/css/recipes.css?version=4" rel="stylesheet" type="text/css" media="all">
  </head>
  <body>
  <div id="audio-player-container">
    <audio id="music" loop preload controls>
      <source src="" id="music-src" crossOrigin="anonymous" type="audio/ogg">
      Your browser does not support the audio element.
    </audio>
  </div>
	<div class="main-container">
		<div class="main-window">
			<div class="subwindow" id="main-image-tall">
        <div id="talltext">
          <h1>Panda's Recipe Book</h1>

          <hr>

          <!-- newest first; each recipe is its own page in templates/recipes/ -->
          <div class="recipe-section">All recipes</div>
          <ul class="recipe-index">
            <li>
              <a href="/recipes/pancakes.html">
                <span class="recipe-title">Buttermilk Pancakes</span>
                <time datetime="2022-01-27">2022.01.27</time>
              </a>
            </li>
            <li>
              <a href="/recipes/katsudon.html">
                <span class="recipe-title">Katsudon</span>
                <time datetime="2022-01-27">2022.01.27</time>
              </a>
            </li>
          </ul>

          <!-- other people's recipe books: ⇒ rows open in a new tab (the pc-98 font has no ↗) -->
          <div class="recipe-section">Elsewhere</div>
          <ul class="recipe-index recipe-elsewhere">
            <li>
              <a href="https://venki.com/recipes" target="_blank" rel="noopener">
                <span class="recipe-title">Venki's recipes</span>
                <span class="recipe-host">venki.com</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
			{{ template "t_lsidebar.html" . }}
			<div class="subwindow" id="right-sidebar"></div>
		</div>
	</div>
  </body>
</html>
