<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda's House</title>
    <link href="/css/style.css?version=5" rel="stylesheet" type="text/css" media="all">
    <link href="/css/room.css?version=3" rel="stylesheet" type="text/css" media="all">
    <link href="/css/living-room.css?version=1" rel="stylesheet" type="text/css" media="all">
    <script src="/js/house-render.js?version=3" defer></script>
    <script src="/js/living-room-data.js?version=5" defer></script>
    <script src="/js/house-room.js?version=7" defer></script>
    <script src="/js/room.js?version=7" defer></script>
  </head>
  <body>
	<div class="main-container">
		<div class="main-window">
			<div class="subwindow" id="main-image">
				<div id="room-frame">
					<div id="room-stage">
						<img id="room-art" alt="Panda's living room, as it is right now: a kotatsu with a plaid quilt on a blue rug, a rose couch under the balcony's sliding doors, a sideboard and a TV, a tall white Brighter lamp and an arc lamp, the bedroom door on the left">
						<svg id="room-hotspots" role="group" aria-label="Things in Panda's living room" xmlns="http://www.w3.org/2000/svg"></svg>
					</div>
				</div>
			</div>
			{{ template "t_lsidebar.html" . }}
			<div class="subwindow" id="text-box">
				<button type="button" id="room-look" aria-label="Look: list everything in the room">見る LOOK</button>
				<div class="text-container">
					<p class="speaker-text">Ｐａｎｄａ</p>
					<p class="dialog-text" id="room-text" aria-live="polite"></p>
					<div id="room-choices" role="menu"></div>
					<noscript>
						<p class="dialog-text">
							<a href="/room.html">Panda's room</a> ·
							<a href="/explore/explore.html">Step outside</a>
						</p>
					</noscript>
				</div>
				<img class="bounce" id="text-arrow" src="/img/icons/text-arrow.png" alt="" hidden>
			</div>
			<div class="subwindow" id="right-sidebar"></div>
		</div>
	</div>
  </body>
</html>
