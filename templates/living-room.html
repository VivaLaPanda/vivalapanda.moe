<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda's House</title>
    <link href="/css/style.css?version=7" rel="stylesheet" type="text/css" media="all">
    <link rel="preload" href="/fonts/pc-9800-core.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/house/state.json" as="fetch" crossorigin>
    <link href="/css/room.css?version=7" rel="stylesheet" type="text/css" media="all">
    <link href="/css/living-room.css?version=2" rel="stylesheet" type="text/css" media="all">
    <script src="/js/house-render.js?version=6" defer></script>
    <script src="/js/living-room-data.js?version=11" defer></script>
    <script src="/js/house-room.js?version=12" defer></script>
    <script src="/js/room.js?version=10" defer></script>
    <script src="/js/room-music.js?version=1" defer></script>
  </head>
  <body>
	<div id="audio-player-container">
		<audio id="music" loop preload="none" data-volume="0.4">
			<source src="/audio/doki-doki-vac09.mp3" type="audio/mpeg">
		</audio>
	</div>
	<div class="main-container">
		<div class="main-window">
			<div class="subwindow" id="main-image">
				<div id="room-frame">
					<div id="room-stage">
						<img id="room-art" alt="Panda's living room, as it is right now: a kotatsu with a plaid quilt on a blue rug, a rose couch under the balcony's sliding doors, a sideboard and a TV, a tall white Brighter lamp and an arc lamp, the bedroom door and the front door on the left">
						<svg id="room-hotspots" role="group" aria-label="Things in Panda's living room" xmlns="http://www.w3.org/2000/svg"></svg>
					</div>
				</div>
				<input type="image" id="mute" alt="mute" aria-label="Mute the music" src="/img/icons/playing_big.png">
			</div>
			{{ template "t_lsidebar.html" . }}
			<div class="subwindow" id="text-box">
				<div id="room-cmds">
					<button type="button" id="room-back" aria-label="Back: where you came from" hidden>戻る BACK</button>
					<button type="button" id="room-look" aria-label="Look: list everything in the room">見る LOOK</button>
				</div>
				<div class="text-container">
					<p class="speaker-text">Ｐａｎｄａ</p>
					<p class="dialog-text" id="room-text" aria-live="polite"></p>
					<div id="room-choices" role="menu"></div>
					<noscript>
						<p class="dialog-text">
							<a href="/room.html">Panda's room</a> ·
							<a href="/explore/explore.html">Step outside</a>
						</p>
					</noscript>
				</div>
				<img class="bounce" id="text-arrow" src="/img/icons/text-arrow.png" alt="" hidden>
			</div>
			<div class="subwindow" id="right-sidebar"></div>
		</div>
	</div>
  </body>
</html>
