<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokugawa Tower Lobby</title>
    <link href="/css/style.css?v=9217b12058" rel="stylesheet" type="text/css" media="all">
    <link rel="preload" href="/fonts/pc-9800-core.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/css/scene.css?v=a1b95277ec" rel="stylesheet" type="text/css" media="all">
    <script src="/js/explore-locations.js?v=d8b17f2b34" defer></script>
    <script src="/js/scene.js?v=221fd6d260" defer></script>
    <script src="/js/house-key.js?v=b8fc1d18d3" defer></script>
    <script src="/js/explore-play.js?v=ac0c6ce1ac" defer></script>
    <script src="/js/scene-music.js?v=296395b47b" defer></script>
  </head>
  <body data-scene="frontdesk">
	<div id="audio-player-container">
		<audio id="music" loop preload="none">
			
		</audio>
	</div>
	<div class="main-container">
		<div class="main-window" id="frame">
			<div class="subwindow" id="main-image">
				<div id="room-frame">
					<div id="room-stage">
						<img id="room-art" alt="">
						<svg id="room-hotspots" role="group" aria-label="Places to go" xmlns="http://www.w3.org/2000/svg"></svg>
					</div>
				</div>
				<input type="image" id="mute" alt="mute" aria-label="Mute the music" src="/img/icons/playing_big.png">
			</div>
			<div class="subwindow" id="left-sidebar">

    <div class="nav-row">
        <a class="navbutton" href="/living-room.html" title="Home">
            <img src="/img/icons/home_recolor.png" alt="Home"></img>
        </a>
        <a class="navbutton" href="/contact.html">
            <img src="/img/icons/envelope_closed_recolor.png"></img>
        </a>
    </div>
    <div class="nav-row">
        <a class="navbutton" href="/radio.html">
            <img src="/img/icons/cd_audio_recolor.png"></img>
        </a>
        <a class="navbutton" href="/blog/">
            <img src="/img/icons/blog_recolor.png"></img>
        </a>
    </div>
    <div class="nav-row">
        <a class="navbutton" href="/recipes.html">
            <img src="/img/icons/recipes_recolor.png"></img>
        </a>
        <span class="navbutton" aria-hidden="true"></span>
    </div>
</div>

			<div class="subwindow" id="text-box">
				<div id="room-cmds">
					<button type="button" id="room-back" aria-label="Back: where you came from" hidden>戻る BACK</button>
					<button type="button" id="room-look" aria-label="Look: list everything here">見る LOOK</button>
				</div>
				<div class="text-container">
					<p class="speaker-text" id="room-speaker">Ｐａｎｄａ</p>
					<p class="dialog-text" id="room-text" aria-live="polite"></p>
					<div id="room-choices" role="menu"></div>
					<noscript>
						<p class="dialog-text"><a href="/living-room.html">Back home</a></p>
					</noscript>
				</div>
				<img class="bounce" id="text-arrow" src="/img/icons/text-arrow.png" alt="" hidden>
			</div>
			<div class="subwindow" id="right-sidebar"></div>
		</div>
	</div>

  </body>
</html>
